name: Claude Auto-Fix

on:
  workflow_run:
    workflows: ["CI Test"]
    types: [completed]
  issue_comment:
    types: [created]

jobs:
  # CI 실패 시 자동 트리거
  auto-fix:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              core.setFailed('No PR found for this workflow run');
              return;
            }
            core.setOutput('number', prs[0].number);
            core.setOutput('branch', context.payload.workflow_run.head_branch);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Capture build error
        run: ./gradlew build --no-daemon 2>&1 | tail -80 > build-error.txt || true

      - name: Setup git for push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Run Claude Auto-Fix
        id: claude-fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            CI 빌드가 실패했습니다. build-error.txt 파일을 읽고 에러를 분석한 뒤 코드를 수정해주세요.

            반드시 다음 순서로 실행해주세요:
            1. build-error.txt 파일을 읽고 에러 원인 파악
            2. 코드 수정 (Edit 도구 사용)
            3. ./gradlew build --no-daemon 으로 빌드 통과 확인
            4. 빌드 통과 후 Bash 도구로 다음 명령 실행:
               git add -A
               git diff --staged --quiet || git commit -m "fix: CI 빌드 에러 자동 수정 (Claude)"
               git push

            빌드를 통과시킬 수 없는 경우, 에러 원인과 수동 수정이 필요한 이유를 상세히 설명해주세요.
          allowed_tools: "Bash,Edit,Write,Read,Glob,Grep"
          timeout_minutes: 10

      - name: Check if fix was pushed
        id: check-push
        if: always()
        run: |
          BEFORE_SHA=${{ github.event.workflow_run.head_sha }}
          git fetch origin ${{ steps.pr.outputs.branch }}
          AFTER_SHA=$(git rev-parse origin/${{ steps.pr.outputs.branch }} 2>/dev/null || echo "unknown")
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR if fix failed
        if: always() && steps.check-push.outputs.pushed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERROR_SUMMARY=""
          if [ -f build-error.txt ]; then
            ERROR_SUMMARY=$(tail -30 build-error.txt)
          fi
          gh pr comment "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ## Claude Auto-Fix 실패

          자동 수정을 시도했으나 코드를 push하지 못했습니다.

          **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          <details>
          <summary>빌드 에러 (마지막 30줄)</summary>

          \`\`\`
          ${ERROR_SUMMARY}
          \`\`\`
          </details>

          > 수동 수정이 필요합니다.
          EOF
          )"

  # PR 코멘트에서 수동 @claude 트리거
  manual-fix:
    if: >
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude') &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup git for push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash,Edit,Write,Read,Glob,Grep"
