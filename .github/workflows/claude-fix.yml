name: Claude Auto-Fix

on:
  workflow_run:
    workflows: ["CI Test"]
    types: [completed]
  issue_comment:
    types: [created]

jobs:
  # CI 실패 시 자동 트리거
  auto-fix:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              core.setFailed('No PR found for this workflow run');
              return;
            }
            core.setOutput('number', prs[0].number);
            core.setOutput('branch', context.payload.workflow_run.head_branch);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Capture build error
        run: ./gradlew build --no-daemon 2>&1 | tail -80 > build-error.txt || true

      - name: Setup git for push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: ""
          prompt: |
            CI 빌드가 실패했습니다. build-error.txt 파일을 읽고 에러를 분석해주세요.

            중요: 코드를 수정한 후 반드시 다음 순서로 실행해주세요:
            1. 코드 수정 (Edit 도구 사용)
            2. ./gradlew build --no-daemon 으로 빌드 통과 확인
            3. Bash 도구로 다음 명령 실행:
               git add -A
               git diff --staged --quiet || git commit -m "fix: CI 빌드 에러 자동 수정 (Claude)"
               git push

  # PR 코멘트에서 수동 @claude 트리거
  manual-fix:
    if: >
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude') &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
