name: CI Test

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & Test
        id: build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build-output.txt

      - name: Post failure comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('build-output.txt', 'utf8');
            const lines = output.split('\n');
            const last150 = lines.slice(-150).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## CI Build Failed\n\`\`\`\n${last150}\n\`\`\`\n\n@claude 이 빌드 에러를 분석하고 수정해줘.`
            });
