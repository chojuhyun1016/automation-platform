name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # PR 코멘트에서 @claude 멘션 시 또는 PR 생성/업데이트 시 실행
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            이 PR을 리뷰해줘.

            리뷰 기준:
            1. CLAUDE.md 코딩 컨벤션 준수 (Java 17, camelCase, 4가지 예외만 사용)
            2. Lambda 제약: Slack 응답 항상 200, 3초 제한, handleRequest() 리턴 후 HTTP 응답
            3. static volatile 캐싱 (300ms+ 객체)
            4. common/clients 모듈이 상위 모듈 참조하지 않는지
            5. 민감 정보 (API 키, 비밀번호) 하드코딩 여부
            6. SQS 위임 시 join() 패턴 사용 여부

            한국어로 리뷰해줘. critical/high 이슈만 코멘트해.
